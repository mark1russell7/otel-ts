# The site of GitHub Pages is a private package of the workspace. The root is the published package.
packages:
  - "site"
  - "packages/*"

# Our own packages: the release train updates them, so the release age check of pnpm does not apply to them.
minimumReleaseAgeExclude:
  - "@mark1russell7/*"
  - "@procedures/*"

# pnpm refuses a version with less evidence of its source than an older version, for 7 days after a publish.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude:
  - "@mark1russell7/*"
  - "@procedures/*"
