# The CI of otel-ts: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The scripts build and test run on the maintained LTS lines of Node.js and on the current
# line.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

# A pull request has one group, and a newer push cancels its run. Each commit of main has its own group, so each one gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@8ad943ea22c2a65479b648664765028cf981da78 # main
    with:
      # build: tsc -b type-checks src and writes dist, as release.yml builds it.
      # test: the "browser runtime" project (happy-dom) and the "node" project.
      scripts: build typecheck test check:conventions
      # The maintained LTS lines and the current line
      node-versions: '["22", "24", "26"]'

  # The site of .github/site.json: the build, the site check and the probe, with no deploy (CI.md of the
  # template, "The site config"). The Pages workflow deploys the same site from main.
  site:
    uses: mark1russell7/template/.github/workflows/reusable-pages-check.yml@8ad943ea22c2a65479b648664765028cf981da78 # main
    permissions:
      contents: read

  # The summary check of the ruleset of main: each job passed (CI.md of the template, "The check of the
  # ruleset").
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, site]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@8ad943ea22c2a65479b648664765028cf981da78 # main
        with:
          needs: ${{ toJSON(needs) }}
