# The CI of otel-ts: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The scripts build and test run on the maintained LTS lines of Node.js and on the current
# line.
name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@d1bed44cb4241636e10195ef2b5e0e49a143c645 # main
    with:
      # build: tsc -b type-checks src and writes dist, as release.yml builds it.
      # test: the "browser runtime" project (happy-dom) and the "node" project.
      scripts: build test
      # The maintained LTS lines and the current line
      node-versions: '["22", "24", "26"]'
